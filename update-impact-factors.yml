name: Refresh publisher Impact Factors

on:
  workflow_dispatch:
  schedule:
    # First day of each month at 06:23 UTC.
    - cron: "23 6 1 * *"

permissions:
  contents: write

concurrency:
  group: refresh-impact-factors
  cancel-in-progress: false

jobs:
  refresh-impact-factors:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install publisher-page parser
        run: python -m pip install --upgrade requests beautifulsoup4
      - name: Refresh official publisher metrics
        run: python scripts/update_impact_factors.py
      - name: Commit updated cache
        run: |
          if git diff --quiet -- impact-factors.json; then
            echo "No Impact Factor cache changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add impact-factors.json
          git commit -m "chore: refresh publisher impact factors"
          git push
