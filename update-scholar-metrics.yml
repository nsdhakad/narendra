name: Refresh Google Scholar metrics

on:
  workflow_dispatch:
  schedule:
    # Weekly on Monday morning (UTC); use workflow_dispatch for an immediate run.
    - cron: "17 7 * * 1"

permissions:
  contents: write

concurrency:
  group: refresh-scholar-metrics
  cancel-in-progress: false

jobs:
  refresh-scholar-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Google Scholar profile reader
        run: python -m pip install --upgrade scholarly
      - name: Refresh citation metrics
        run: python scripts/update_scholar_metrics.py
      - name: Commit changed metrics
        run: |
          if git diff --quiet -- scholar-metrics.json; then
            echo "No Scholar metric changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar-metrics.json
          git commit -m "chore: refresh Google Scholar metrics"
          git push
